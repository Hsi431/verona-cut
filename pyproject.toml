[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verona-cut"
version = "0.1.0a1"
description = "Offline Linux design, editing and cutting for Siser Juliet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "PySide6==6.10.2",
    "svgpathtools==1.7.2",
    "pyusb==1.3.1",
    "numpy>=2.0,<3",
    "scipy>=1.15.3,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
verona = "verona.ui:main"
verona-cut = "verona.cli:main"
verona-mcp = "verona.mcp_server:main"
verona-desktop = "verona.desktop_integration:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["verona*"]

[tool.setuptools.package-data]
verona = ["agent-guide.md", "icons/*.svg"]
